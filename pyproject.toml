[project]
name = "gsc-mcp"
version = "0.1.0"
description = "MCP server for Google Search Console API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Akshay Rawat" },
]
keywords = ["mcp", "google-search-console", "claude", "ai", "search-analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=2.11",
    "google-api-python-client>=2.80",
    "google-auth-oauthlib>=1.0",
    "google-auth>=2.20",
    "cryptography>=42.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.urls]
Homepage = "https://github.com/kn00m1/google-search-console-mcp"
Repository = "https://github.com/kn00m1/google-search-console-mcp"
Issues = "https://github.com/kn00m1/google-search-console-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
