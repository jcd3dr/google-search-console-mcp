version: '3.8'
services:
  gsc-mcp:
    image: python:3.11-slim
    working_dir: /app
    command: bash -c "pip install -q uv && uv sync && GSC_WRITE_ACCESS=true uv run python -m gsc_mcp.server"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./:/app
    ports:
      - "3000:3000"
    restart: always
